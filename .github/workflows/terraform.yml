name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      # --- Clone Repository (like Jenkins clone stage) ---
      - name: Checkout Repository
        uses: actions/checkout@v3

      # --- Setup Terraform ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      # --- Terraform Init ---
      - name: Terraform Init
        working-directory: Day-2-main-config-file
        run: terraform init

      # --- Terraform Plan ---
      - name: Terraform Plan
        working-directory: Day-2-main-config-file
        run: terraform plan
